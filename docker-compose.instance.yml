name: armonic-${INSTANCE:?set INSTANCE, e.g. INSTANCE=2}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: armonic
      POSTGRES_PASSWORD: armonic
      POSTGRES_DB: armonic
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armonic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://armonic:armonic@db:5432/armonic?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PORT: ${APP_PORT:-8090}
      HOST: ${APP_HOST:-localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_DIR: /app/data/uploads
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      POW_ENABLED: ${POW_ENABLED:-false}
    volumes:
      - ${CONFIG_FILE:-./config.json}:/app/config.json:ro
      - uploads:/app/data
    ports:
      - "${APP_PORT:-8090}:${APP_PORT:-8090}"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
