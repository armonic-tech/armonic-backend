name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  LANDING_REPO: armonic-tech/landing

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must point at a commit on master
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "::error::$GITHUB_REF_NAME no apunta a un commit contenido en master"
            exit 1
          fi

  binaries:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - run: go mod download

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          bin=armonic
          [ "$GOOS" = windows ] && bin=armonic.exe
          mkdir -p "dist/armonic-$GITHUB_REF_NAME"
          go build -trimpath -ldflags="-s -w" -o "dist/armonic-$GITHUB_REF_NAME/$bin" .
          cp README.md LICENSE "dist/armonic-$GITHUB_REF_NAME/"
          cp config.json "dist/armonic-$GITHUB_REF_NAME/config.json.example"

      - name: Package
        run: |
          cd dist
          name=armonic-backend-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = windows ]; then
            zip -qr "$name.zip" "armonic-$GITHUB_REF_NAME"
          else
            tar -czf "$name.tar.gz" "armonic-$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  compose-bundle:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble bundle
        run: |
          mkdir -p bundle
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          sed "s|build: \.|image: $image|" docker-compose.yml > bundle/docker-compose.yml
          cp config.json bundle/config.json.example
          cp README.md LICENSE bundle/
          cd bundle && zip -qr ../armonic-backend-docker.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: backend-compose
          path: armonic-backend-docker.zip

  docker:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [binaries, compose-bundle, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: backend-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  notify-landing:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to landing repo
        env:
          GH_TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
        run: |
          gh api "repos/$LANDING_REPO/dispatches" \
            -f event_type=release-published \
            -F "client_payload[product]=backend" \
            -F "client_payload[version]=$GITHUB_REF_NAME" \
            -F "client_payload[repo]=$GITHUB_REPOSITORY"
