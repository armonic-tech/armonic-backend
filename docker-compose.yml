services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: armonic
      POSTGRES_PASSWORD: armonic
      POSTGRES_DB: armonic
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armonic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://armonic:armonic@db:5432/armonic?sslmode=disable
      JWT_SECRET: change-me
      PORT: "8080"
      LOG_LEVEL: info
      # CORS_ALLOWED_ORIGINS: "https://app.armonic.com,http://localhost:3000"
      CORS_ALLOWED_ORIGINS: ""
    volumes:
      - ./config.json:/app/config.json:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:
