definitions:
  attachment.Attachment:
    properties:
      createdAt:
        type: string
      encrypted:
        type: boolean
      height:
        type: integer
      id:
        type: string
      mime:
        type: string
      serverId:
        type: string
      size:
        type: integer
      thumbSize:
        type: integer
      thumbUrl:
        type: string
      url:
        type: string
      userId:
        type: string
      width:
        type: integer
    type: object
  channel.ChannelInfo:
    properties:
      id:
        type: string
      name:
        type: string
      serverId:
        type: string
      type:
        type: string
    type: object
  channel.Member:
    properties:
      avatarId:
        type: string
      deafened:
        type: boolean
      displayName:
        type: string
      id:
        type: string
      linked:
        description: |-
          Linked is false while the member's peer connection is still being set
          up: present in the channel, but no audio can flow either way yet.
        type: boolean
      muted:
        type: boolean
    type: object
  handlers.ChannelDetailResponse:
    properties:
      connected:
        items:
          $ref: '#/definitions/channel.Member'
        type: array
      connectedCount:
        type: integer
      id:
        type: string
      name:
        type: string
      serverId:
        type: string
      type:
        type: string
    type: object
  handlers.CommitResponse:
    properties:
      epoch:
        type: integer
    type: object
  handlers.ConsumeWelcomeRequest:
    properties:
      deviceId:
        type: string
      id:
        type: string
    type: object
  handlers.GroupStateResponse:
    properties:
      coordinatorUserId:
        description: |-
          The connected member expected to commit pending changes: the owner when
          online, else the lowest connected user id. Anyone may still commit.
        type: string
      epoch:
        type: integer
      keyPackagesLeft:
        type: integer
      members:
        items:
          $ref: '#/definitions/mls.Member'
        type: array
      pendingAdds:
        items:
          $ref: '#/definitions/mls.PendingAdd'
        type: array
      pendingRemoves:
        items:
          $ref: '#/definitions/mls.Member'
        type: array
      welcome:
        $ref: '#/definitions/mls.Welcome'
    type: object
  handlers.InviteCreatedResponse:
    properties:
      inviteToken:
        type: string
      url:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      altcha:
        example: eyJhbGdvcml0aG0iOi...
        type: string
      password:
        example: s3cr3t-p4ss
        type: string
      username:
        example: admin
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      token:
        example: eyJhbG...
        type: string
    type: object
  handlers.MeResponse:
    properties:
      avatarId:
        type: string
      avatarUrl:
        type: string
      displayName:
        type: string
      id:
        type: string
    type: object
  handlers.PublishKeyPackagesRequest:
    properties:
      deviceId:
        type: string
      keyPackages:
        items:
          $ref: '#/definitions/mls.KeyPackage'
        type: array
    type: object
  handlers.RegisterDeviceRequest:
    properties:
      deviceId:
        type: string
      signingKey:
        type: string
    type: object
  handlers.ServerLogoResponse:
    properties:
      attachmentId:
        type: string
      logoId:
        type: string
      logoThumbUrl:
        type: string
      logoUrl:
        type: string
    type: object
  handlers.ServerResponse:
    properties:
      claimed:
        example: false
        type: boolean
      description:
        example: ""
        type: string
      host:
        example: localhost:8080
        type: string
      id:
        example: 1a2b3c4d5e-...
        type: string
      logoId:
        type: string
      logoThumbUrl:
        type: string
      logoUrl:
        type: string
      memberCount:
        example: 0
        type: integer
      name:
        example: Armonic
        type: string
    type: object
  handlers.StorageResponse:
    properties:
      limitBytes:
        type: integer
      usedBytes:
        type: integer
    type: object
  message.Message:
    properties:
      attachmentId:
        type: string
      channelId:
        type: string
      content:
        type: string
      createdAt:
        type: string
      encrypted:
        type: boolean
      id:
        type: string
      serverId:
        type: string
      userId:
        type: string
    type: object
  mls.AddRequest:
    properties:
      deviceId:
        type: string
      keyPackageId:
        type: string
    type: object
  mls.Commit:
    properties:
      createdAt:
        type: string
      epoch:
        type: integer
      payload:
        type: string
      senderDeviceId:
        type: string
    type: object
  mls.CommitRequest:
    properties:
      adds:
        items:
          $ref: '#/definitions/mls.AddRequest'
        type: array
      deviceId:
        type: string
      epoch:
        type: integer
      payload:
        type: string
      removes:
        items:
          type: string
        type: array
      welcomes:
        additionalProperties:
          type: string
        type: object
    type: object
  mls.KeyPackage:
    properties:
      deviceId:
        type: string
      id:
        type: string
      payload:
        type: string
      userId:
        type: string
    type: object
  mls.Member:
    properties:
      deviceId:
        type: string
      userId:
        type: string
    type: object
  mls.PendingAdd:
    properties:
      deviceId:
        type: string
      keyPackage:
        type: string
      keyPackageId:
        type: string
      userId:
        type: string
    type: object
  mls.Welcome:
    properties:
      createdAt:
        type: string
      epoch:
        type: integer
      id:
        type: string
      payload:
        type: string
    type: object
  pow.Challenge:
    properties:
      algorithm:
        type: string
      challenge:
        type: string
      maxnumber:
        type: integer
      salt:
        type: string
      signature:
        type: string
    type: object
  server.MemberInfo:
    properties:
      avatarId:
        type: string
      avatarUrl:
        type: string
      displayName:
        type: string
      id:
        type: string
      isOwner:
        type: boolean
      online:
        type: boolean
    type: object
  server.ServerInfo:
    properties:
      id:
        type: string
      logoId:
        type: string
      logoThumbUrl:
        type: string
      logoUrl:
        type: string
      name:
        type: string
      ownerId:
        type: string
    type: object
info:
  contact: {}
  description: Armonic API backend server.
  title: Armonic API
  version: "1.0"
paths:
  /attachment/{id}:
    get:
      description: Member-only. Serves the sanitized image bytes.
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: attachment not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Fetch an attachment
      tags:
      - Attachment
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login user in already claimed server
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: invalid body
          schema:
            type: string
        "401":
          description: invalid credentials
          schema:
            type: string
        "403":
          description: server not claimed yet
          schema:
            type: string
        "409":
          description: proof of work expired or already used
          schema:
            type: string
        "429":
          description: rate limit exceeded
          schema:
            type: string
      summary: Login user
      tags:
      - Users
  /channel/{id}:
    get:
      consumes:
      - application/json
      description: Get a single channel by its id, enriched with live voice state
        (who is connected right now) when it's a voice channel
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ChannelDetailResponse'
        "400":
          description: invalid channel id
          schema:
            type: string
        "404":
          description: channel not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Channel info by id
      tags:
      - Channel
  /channel/{id}/messages:
    get:
      description: Get a page of messages for a channel (newest first)
      parameters:
      - description: Channel ID
        in: path
        name: id
        required: true
        type: string
      - description: Max messages to return (default 50, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/message.Message'
            type: array
        "400":
          description: invalid channel id
          schema:
            type: string
        "404":
          description: channel not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Channel messages
      tags:
      - Channel
  /info:
    get:
      consumes:
      - application/json
      description: Get status info from server
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ServerResponse'
      summary: Server info
      tags:
      - Server
  /me:
    get:
      description: The authenticated caller's id, display name and avatar.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "401":
          description: unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Own profile
      tags:
      - Users
  /me/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Uploads an image through the same pipeline as attachments and points
        the caller's avatar at it.
      parameters:
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/attachment.Attachment'
        "413":
          description: file exceeds the maximum upload size
          schema:
            type: string
        "415":
          description: unsupported image format
          schema:
            type: string
        "429":
          description: rate limit exceeded
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Set own avatar
      tags:
      - Users
  /me/mls/device:
    post:
      consumes:
      - application/json
      description: Declares this install's device id and Ed25519 signing key. Idempotent
        for the same user; a device id owned by another account is rejected.
      parameters:
      - description: Device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterDeviceRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid device
          schema:
            type: string
        "409":
          description: device registered to another user
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Register an MLS device
      tags:
      - MLS
  /me/mls/keypackages:
    post:
      consumes:
      - application/json
      description: Adds single-use key packages for one of the caller's devices. Every
        server the caller belongs to is nudged (`mls-sync`) so a committer can add
        the device.
      parameters:
      - description: Key packages
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.PublishKeyPackagesRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid key packages
          schema:
            type: string
        "403":
          description: device belongs to another user
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Publish key packages
      tags:
      - MLS
  /me/storage:
    get:
      description: Bytes the caller's uploads occupy against the per-user quota.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.StorageResponse'
      security:
      - BearerAuth: []
      summary: Own storage usage
      tags:
      - Users
  /pow/challenge:
    get:
      description: Issues an Altcha-compatible challenge. Solve it and send the base64
        solution in the "altcha" field of the login, claim or invite-signup request.
        Returns 404 when POW_ENABLED is off.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pow.Challenge'
        "404":
          description: proof of work is disabled
          schema:
            type: string
      summary: Proof-of-work challenge
      tags:
      - Users
  /server:
    get:
      description: List the servers the authenticated user is a member of
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.ServerInfo'
            type: array
        "401":
          description: unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: My servers
      tags:
      - Server
  /server/{id}:
    get:
      consumes:
      - application/json
      description: Get channels from server with server-id
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/channel.ChannelInfo'
            type: array
      security:
      - BearerAuth: []
      summary: Server id info
      tags:
      - Server
  /server/{id}/invite:
    post:
      description: Owner-only. Mint a single-use invite link for a server.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.InviteCreatedResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "403":
          description: forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create invite
      tags:
      - Invite
  /server/{id}/logo:
    delete:
      description: Owner-only. Leaves the server without a logo, so clients fall back
        to drawing its initials; GET /server/{id}/logo answers 404 again. Idempotent
        — a server that has no logo still answers 204. The uploaded image itself is
        kept (no attachment deletion exists yet), it is only unlinked.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Remove the server logo
      tags:
      - Server
    get:
      description: 'Public. The server''s logo bytes, or 404 when none is set. Unauthenticated
        on purpose: the rail of a client draws an instance it may not (yet) be a member
        of, next to the name and description /info already hands out.'
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: logo not set
          schema:
            type: string
      summary: Fetch the server logo
      tags:
      - Server
    post:
      consumes:
      - multipart/form-data
      description: Owner-only. Uploads an image through the same pipeline as attachments
        and points the server's logo at it. The logo is then readable without a token
        (GET /server/{id}/logo), since it is part of the instance's public identity
        like its name.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ServerLogoResponse'
        "403":
          description: forbidden
          schema:
            type: string
        "413":
          description: file exceeds the maximum upload size
          schema:
            type: string
        "415":
          description: unsupported image format
          schema:
            type: string
        "429":
          description: rate limit exceeded
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Set the server logo
      tags:
      - Server
  /server/{id}/members:
    get:
      description: 'Member-only. The roster of a server: every member with their display
        name, avatar and owner flag, plus whether they currently have a live WebSocket
        connection.'
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.MemberInfo'
            type: array
        "400":
          description: invalid server id
          schema:
            type: string
        "403":
          description: forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Server members
      tags:
      - Server
  /server/{id}/mls:
    get:
      description: Member-only. The group's epoch and roster as the delivery service
        sees it, the devices waiting to be added or evicted, who is expected to commit,
        and — for the calling device — any pending welcome and how many key packages
        it has left.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      - description: Calling device
        in: query
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GroupStateResponse'
        "403":
          description: forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: MLS group state
      tags:
      - MLS
  /server/{id}/mls/commit:
    post:
      consumes:
      - application/json
      description: Member-only. Advances the group one epoch. Rejected with 409 when
        built against a stale epoch (fetch the missed commits and retry), 400 when
        it adds a device without an available key package or removes one not in the
        group. On success the commit is broadcast as `mls-commit` to every connected
        member.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      - description: Commit
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/mls.CommitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CommitResponse'
        "400":
          description: invalid commit
          schema:
            type: string
        "409":
          description: stale epoch
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Post a commit
      tags:
      - MLS
  /server/{id}/mls/commits:
    get:
      description: Member-only. The commits a device missed, in epoch order, so an
        offline device can catch up.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      - description: Last epoch the device applied
        in: query
        name: after
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/mls.Commit'
            type: array
      security:
      - BearerAuth: []
      summary: Commits after an epoch
      tags:
      - MLS
  /server/{id}/mls/welcome/ack:
    post:
      consumes:
      - application/json
      description: Marks a welcome as processed so the state endpoint stops returning
        it.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      - description: Welcome
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ConsumeWelcomeRequest'
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Acknowledge a welcome
      tags:
      - MLS
  /server/{id}/upload:
    post:
      consumes:
      - multipart/form-data
      description: Member-only. Multipart upload of one image (field "file"). The
        file is validated by magic number, decoded, stripped of all metadata by re-encoding
        its pixels, thumbnailed and stored. The uploaded bytes are discarded.
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/attachment.Attachment'
        "400":
          description: image could not be decoded
          schema:
            type: string
        "413":
          description: file exceeds the maximum upload size
          schema:
            type: string
        "415":
          description: unsupported image format
          schema:
            type: string
        "422":
          description: image dimensions exceed the configured limit
          schema:
            type: string
        "429":
          description: rate limit exceeded
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Upload an image
      tags:
      - Attachment
  /server/{id}/upload/encrypted:
    post:
      consumes:
      - multipart/form-data
      description: 'Member-only. Multipart upload of an end-to-end encrypted image:
        "file" is the ciphertext of the sanitized image, "thumb" the ciphertext of
        its thumbnail (optional; the full blob doubles as the thumbnail when absent).
        The server stores both as opaque bytes — it cannot decode, validate or thumbnail
        them — applying only the byte cap, the per-user rate limit and the storage
        quota. The keys travel inside the MLS-encrypted message that references the
        attachment (docs/ai/e2ee.md).'
      parameters:
      - description: Server ID
        in: path
        name: id
        required: true
        type: string
      - description: Encrypted image
        in: formData
        name: file
        required: true
        type: file
      - description: Encrypted thumbnail
        in: formData
        name: thumb
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/attachment.Attachment'
        "413":
          description: file exceeds the maximum upload size
          schema:
            type: string
        "429":
          description: rate limit exceeded
          schema:
            type: string
        "507":
          description: storage quota exceeded
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Upload an encrypted attachment
      tags:
      - Attachment
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and the JWT returned by /auth/login.
      Example: "Bearer eyJhbGci..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: User endpoints
  name: Users
- description: Server endpoint
  name: Server
- description: Channel endpoint
  name: Channel
