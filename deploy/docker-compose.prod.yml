# Production stack for one VPS: Postgres, the backend, the voice bot and Caddy.
# Expects ../ to be this repo and ../../armonic-bot the bot repo. See README.md.

name: armonic

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: armonic
      # Applied only when the volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: armonic
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armonic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: ..
    # Voice needs the host network: one known UDP port and the public IP on
    # the host candidates (docs/ai/ws-protocol.md).
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://armonic:${POSTGRES_PASSWORD}@localhost:5432/armonic?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CLAIM_PASSWORD: ${CLAIM_PASSWORD:?set CLAIM_PASSWORD in .env}
      PORT: "8080"
      LOG_LEVEL: info
      LOG_FILE: /app/data/armonic.log
      RTC_HOST_IPS: ""
      RTC_UDP_PORT: "50000"
      PUBLIC_BASE_URL: https://${API_DOMAIN:?set API_DOMAIN in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: "127.0.0.1,::1"
      UPLOAD_DIR: /app/data/uploads
      POW_ENABLED: "false"
    volumes:
      - uploads:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    network_mode: host
    environment:
      API_DOMAIN: ${API_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  bot:
    build: ../../armonic-bot
    network_mode: host
    depends_on:
      - app
    env_file: bot.env
    volumes:
      - ./bot.config.yaml:/app/config.yaml:ro
      - bot-data:/app/data
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
  bot-data:
